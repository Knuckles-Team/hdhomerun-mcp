services:
  hdhomerun-mcp-mcp:
    # Slim MCP-only image (built `--target mcp`, pushed as the :mcp tag).
    image: knucklessg1/hdhomerun-mcp:mcp
    container_name: hdhomerun-mcp-mcp
    hostname: hdhomerun-mcp-mcp
    restart: always
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
      - TRANSPORT=streamable-http
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  hdhomerun-mcp-agent:
    # Full agent runtime image (default target, pushed as :1.1.0).
    image: knucklessg1/hdhomerun-mcp:1.1.0
    container_name: hdhomerun-mcp-agent
    hostname: hdhomerun-mcp-agent
    restart: always
    depends_on:
      - hdhomerun-mcp-mcp
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    command: [ "hdhomerun-agent" ]
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=9000
      - MCP_URL=http://hdhomerun-mcp-mcp:8000/mcp
      - PROVIDER=${PROVIDER:-openai}
      - MODEL_ID=${MODEL_ID:-gpt-4o}
      - ENABLE_WEB_UI=True
      - ENABLE_OTEL=True
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
