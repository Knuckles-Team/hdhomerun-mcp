services:
  hdhomerun-mcp-mcp:
    # Slim MCP-only image (built `--target mcp`, pushed as the :mcp tag).
    image: knucklessg1/hdhomerun-mcp:mcp
    container_name: hdhomerun-mcp-mcp
    hostname: hdhomerun-mcp-mcp
    restart: always
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
      - TRANSPORT=streamable-http
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
