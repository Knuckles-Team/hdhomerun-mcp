[bumpversion]
current_version = 1.1.0
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(all-extra):pyproject.toml]
search = hdhomerun-mcp[mcp,agent,logfire]>={current_version}
replace = hdhomerun-mcp[mcp,agent,logfire]>={new_version}

[bumpversion:file:a2a.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:README.md]
search = Version: {current_version}
replace = Version: {new_version}

[bumpversion:file(mcp-img):docker/Dockerfile]
search = hdhomerun-mcp[mcp]>={current_version}
replace = hdhomerun-mcp[mcp]>={new_version}

[bumpversion:file(agent-img):docker/Dockerfile]
search = hdhomerun-mcp[agent]>={current_version}
replace = hdhomerun-mcp[agent]>={new_version}

[bumpversion:file(tag-example):docker/Dockerfile]
search = -t hdhomerun-mcp:{current_version} .
replace = -t hdhomerun-mcp:{new_version} .

[bumpversion:file(compose-img-tag):docker/agent.compose.yml]
search = knucklessg1/hdhomerun-mcp:{current_version}
replace = knucklessg1/hdhomerun-mcp:{new_version}

[bumpversion:file(compose-img-comment):docker/agent.compose.yml]
search = pushed as :{current_version}
replace = pushed as :{new_version}

[bumpversion:file(deploy-img-tag):docs/deployment.md]
search = knucklessg1/hdhomerun-mcp:{current_version}
replace = knucklessg1/hdhomerun-mcp:{new_version}

[bumpversion:file(install-img-tag):docs/installation.md]
search = knucklessg1/hdhomerun-mcp:{current_version}
replace = knucklessg1/hdhomerun-mcp:{new_version}

[bumpversion:file(readme-img-tag):README.md]
search = knucklessg1/hdhomerun-mcp:{current_version}
replace = knucklessg1/hdhomerun-mcp:{new_version}

[bumpversion:file(readme-img-tag-short):README.md]
search = `[agent]` / `:{current_version}`
replace = `[agent]` / `:{new_version}`

[bumpversion:file:hdhomerun_mcp/agent_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:hdhomerun_mcp/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
